services:
  postgres:
    image: postgres:17-alpine
    environment: { POSTGRES_DB: feed, POSTGRES_USER: feed, POSTGRES_PASSWORD: feed }
    ports: [ "127.0.0.1:${POSTGRES_PORT:-5432}:5432" ]
    volumes: [ "pg:/var/lib/postgresql/data" ]
    healthcheck: { test: [ CMD-SHELL, "pg_isready -U feed" ], interval: 5s, timeout: 3s, retries: 20 }
  redis:
    image: redis:7.4-alpine
    ports: [ "127.0.0.1:${REDIS_PORT:-6379}:6379" ]
  kafka:
    image: apache/kafka:3.9.1
    hostname: kafka
    ports: [ "127.0.0.1:${KAFKA_PORT:-9092}:9092" ]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:${KAFKA_PORT:-9092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
  s3:
    image: localstack/localstack:4.10.0
    environment: { SERVICES: s3, AWS_DEFAULT_REGION: us-east-1 }
    ports: [ "127.0.0.1:${S3_PORT:-9000}:4566" ]
    volumes: [ "./docker/init-s3.sh:/etc/localstack/init/ready.d/init-s3.sh:ro" ]
  app:
    build: .
    ports: [ "127.0.0.1:${APP_PORT:-8080}:8080" ]
    environment:
      # The application rejects a missing development secret or mixed OIDC/HMAC settings.
      JWT_SECRET: ${JWT_SECRET:-}
      AUTH_MODE: ${AUTH_MODE:-development}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-}
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_JWK_SET_URI: ${OIDC_JWK_SET_URI:-}
      OIDC_AUDIENCE: ${OIDC_AUDIENCE:-social-feed-api}
      DB_URL: ${DB_URL:-jdbc:postgresql://postgres:5432/feed}
      REDIS_HOST: redis
      KAFKA_BOOTSTRAP: kafka:29092
      S3_ENDPOINT: http://s3:4566
      FEED_S3_PUBLIC_ENDPOINT: http://localhost:${S3_PORT:-9000}
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_started }
      redis: { condition: service_started }
      s3: { condition: service_started }
volumes: { pg: { } }
